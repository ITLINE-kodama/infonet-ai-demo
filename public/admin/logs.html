<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ログ・履歴｜AIでらくらく更新</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/assets/styles.css" />
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-[#F9FAFB] text-[#111827]">

<div class="flex">
  <aside id="sidebar"></aside>

  <main class="flex-1 min-w-0 p-8 max-w-[1400px]">
    <div class="flex items-center justify-between flex-wrap gap-3">
      <div>
        <h1 class="text-2xl font-bold">ログ・履歴</h1>
        <p class="mt-1 text-sm text-[#6B7280]">「誰が・いつ・何を」操作したかをすべて記録します。AI入出力の全文も監査可能です。</p>
      </div>
      <button id="csv-btn"
        class="inline-flex items-center gap-2 px-4 py-2.5 rounded-lg border border-[#E5E7EB] bg-white text-sm font-semibold text-[#374151] hover:bg-[#F9FAFB]">
        <i data-lucide="download" class="w-4 h-4"></i> CSVエクスポート
      </button>
    </div>

    <!-- フィルタ -->
    <div class="mt-5 flex flex-wrap items-center gap-2" id="filters">
      <span class="text-[13px] text-[#6B7280] mr-1">操作種別：</span>
      <button data-f="all" class="filter-btn px-3 py-1.5 rounded-full text-[13px] font-medium bg-[#1E2761] text-white">すべて</button>
      <button data-f="generate" class="filter-btn px-3 py-1.5 rounded-full text-[13px] font-medium bg-white border border-[#E5E7EB] text-[#374151]">AI生成</button>
      <button data-f="save_draft" class="filter-btn px-3 py-1.5 rounded-full text-[13px] font-medium bg-white border border-[#E5E7EB] text-[#374151]">下書き保存</button>
      <button data-f="publish" class="filter-btn px-3 py-1.5 rounded-full text-[13px] font-medium bg-white border border-[#E5E7EB] text-[#374151]">公開</button>
      <button data-f="unpublish" class="filter-btn px-3 py-1.5 rounded-full text-[13px] font-medium bg-white border border-[#E5E7EB] text-[#374151]">非公開化</button>
      <button data-f="delete" class="filter-btn px-3 py-1.5 rounded-full text-[13px] font-medium bg-white border border-[#E5E7EB] text-[#374151]">削除</button>
    </div>

    <div class="mt-4 bg-white border border-[#E5E7EB] rounded-xl">
      <div class="overflow-x-auto thin-scroll rounded-xl">
      <table class="w-full text-sm min-w-[880px]">
        <thead>
          <tr class="bg-[#F9FAFB] text-left text-[12px] text-[#6B7280] border-b border-[#E5E7EB]">
            <th class="px-5 py-3 font-medium w-44">日時</th>
            <th class="px-5 py-3 font-medium w-40">ユーザー</th>
            <th class="px-5 py-3 font-medium w-32">操作</th>
            <th class="px-5 py-3 font-medium">対象</th>
            <th class="px-5 py-3 font-medium w-40">AIモデル</th>
            <th class="px-5 py-3 font-medium w-24 text-right">トークン</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
      </div>
      <div id="empty" class="hidden px-5 py-16 text-center">
        <i data-lucide="scroll-text" class="w-10 h-10 mx-auto text-[#D1D5DB]"></i>
        <p class="mt-3 text-sm text-[#6B7280]">該当するログはありません。</p>
      </div>
    </div>
    <p class="mt-3 text-[12px] text-[#9CA3AF]">
      ※ 個人で生成AIを契約・利用した場合、このような操作ログは企業側に残りません。法人AI環境では全操作を記録・監査できます。
    </p>
  </main>
</div>

<!-- 詳細モーダル -->
<div id="detail-modal" class="hidden fixed inset-0 z-50 bg-black/40 flex items-center justify-center p-4">
  <div class="bg-white rounded-xl shadow-xl w-full max-w-2xl max-h-[85vh] flex flex-col">
    <div class="px-6 py-4 border-b border-[#E5E7EB] flex items-center justify-between">
      <h3 class="text-base font-semibold">ログ詳細</h3>
      <button id="modal-close" class="text-[#6B7280] hover:text-[#111827]"><i data-lucide="x" class="w-5 h-5"></i></button>
    </div>
    <div id="modal-body" class="px-6 py-5 overflow-y-auto thin-scroll text-sm"></div>
  </div>
</div>

<script src="/assets/store.js"></script>
<script src="/assets/admin.js"></script>
<script>
  const user = initAdmin("logs");

  let allLogs = [];
  let filter = "all";

  const ACTION = {
    generate:  { label: "AI生成",   cls: "bg-[#CFFAFE] text-[#155E75]" },
    save_draft:{ label: "下書き保存", cls: "bg-[#FEF3C7] text-[#92400E]" },
    publish:   { label: "公開",     cls: "bg-[#D1FAE5] text-[#065F46]" },
    unpublish: { label: "非公開化", cls: "bg-[#FEF3C7] text-[#92400E]" },
    delete:    { label: "削除",     cls: "bg-[#FEE2E2] text-[#991B1B]" },
    edit:      { label: "編集",     cls: "bg-[#E5E7EB] text-[#374151]" },
    login:     { label: "ログイン", cls: "bg-[#E5E7EB] text-[#374151]" },
  };

  function render() {
    const list = filter === "all" ? allLogs : allLogs.filter((l) => l.action === filter);
    const rows = document.getElementById("rows");
    const empty = document.getElementById("empty");
    if (list.length === 0) {
      rows.innerHTML = "";
      empty.classList.remove("hidden");
      lucide.createIcons();
      return;
    }
    empty.classList.add("hidden");
    rows.innerHTML = list
      .map((l, i) => {
        const a = ACTION[l.action] || { label: l.action, cls: "bg-[#E5E7EB] text-[#374151]" };
        return `
      <tr data-i="${i}" class="border-b border-[#E5E7EB] last:border-0 hover:bg-[#F9FAFB] cursor-pointer">
        <td class="px-5 py-3 text-[#6B7280] whitespace-nowrap">${formatDateTime(l.timestamp)}</td>
        <td class="px-5 py-3">${escapeHtml(l.userName)}</td>
        <td class="px-5 py-3"><span class="text-[12px] font-semibold px-2 py-0.5 rounded ${a.cls}">${a.label}</span></td>
        <td class="px-5 py-3 text-[#374151]">${escapeHtml(l.targetTitle || "—")}</td>
        <td class="px-5 py-3 text-[#6B7280]">${escapeHtml(l.aiModel || "—")}</td>
        <td class="px-5 py-3 text-right text-[#6B7280]">${l.tokensUsed != null ? l.tokensUsed : "—"}</td>
      </tr>`;
      })
      .join("");
    // クリックで詳細
    rows.querySelectorAll("tr").forEach((tr) => {
      tr.addEventListener("click", () => openDetail(list[Number(tr.dataset.i)]));
    });
    lucide.createIcons();
  }

  function openDetail(l) {
    const a = ACTION[l.action] || { label: l.action };
    const body = document.getElementById("modal-body");
    body.innerHTML = `
      <dl class="grid grid-cols-3 gap-y-2.5">
        <dt class="text-[#6B7280]">日時</dt><dd class="col-span-2">${formatDateTime(l.timestamp)}</dd>
        <dt class="text-[#6B7280]">ユーザー</dt><dd class="col-span-2">${escapeHtml(l.userName)}（${escapeHtml(l.userId)}）</dd>
        <dt class="text-[#6B7280]">操作</dt><dd class="col-span-2">${a.label}</dd>
        <dt class="text-[#6B7280]">対象</dt><dd class="col-span-2">${escapeHtml(l.targetTitle || "—")}</dd>
        <dt class="text-[#6B7280]">AIモデル</dt><dd class="col-span-2">${escapeHtml(l.aiModel || "—")}</dd>
        <dt class="text-[#6B7280]">トークン数</dt><dd class="col-span-2">${l.tokensUsed != null ? l.tokensUsed : "—"}</dd>
      </dl>
      ${l.userPrompt ? `
        <div class="mt-5">
          <p class="text-[12px] font-semibold text-[#6B7280] mb-1">ユーザー入力プロンプト（全文）</p>
          <div class="bg-[#F9FAFB] border border-[#E5E7EB] rounded-lg p-3 text-[13px] whitespace-pre-wrap leading-relaxed">${escapeHtml(l.userPrompt)}</div>
        </div>` : ""}
      ${l.aiOutput ? `
        <div class="mt-4">
          <p class="text-[12px] font-semibold text-[#6B7280] mb-1">AI出力（全文）</p>
          <div class="bg-[#F9FAFB] border border-[#E5E7EB] rounded-lg p-3 text-[13px] whitespace-pre-wrap leading-relaxed">${escapeHtml(l.aiOutput)}</div>
        </div>` : ""}
      ${!l.userPrompt && !l.aiOutput ? `<p class="mt-4 text-[13px] text-[#9CA3AF]">この操作にはAI入出力の記録はありません。</p>` : ""}
    `;
    document.getElementById("detail-modal").classList.remove("hidden");
    lucide.createIcons();
  }

  document.getElementById("modal-close").addEventListener("click", () =>
    document.getElementById("detail-modal").classList.add("hidden"));
  document.getElementById("detail-modal").addEventListener("click", (e) => {
    if (e.target.id === "detail-modal") e.currentTarget.classList.add("hidden");
  });

  document.getElementById("filters").addEventListener("click", (e) => {
    const btn = e.target.closest(".filter-btn");
    if (!btn) return;
    filter = btn.dataset.f;
    document.querySelectorAll(".filter-btn").forEach((b) => {
      const on = b === btn;
      b.classList.toggle("bg-[#1E2761]", on);
      b.classList.toggle("text-white", on);
      b.classList.toggle("bg-white", !on);
      b.classList.toggle("border", !on);
      b.classList.toggle("border-[#E5E7EB]", !on);
      b.classList.toggle("text-[#374151]", !on);
    });
    render();
  });

  document.getElementById("csv-btn").addEventListener("click", () => {
    toast("ログをCSVでダウンロードしました（デモ）", "success");
  });

  async function load() {
    try { allLogs = await apiListLogs(); } catch { allLogs = []; }
    render();
  }
  load();
</script>
</body>
</html>
