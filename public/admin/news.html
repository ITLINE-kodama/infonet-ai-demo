<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ニュース更新｜AIでらくらく更新</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/assets/styles.css" />
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-[#F9FAFB] text-[#111827]">

<div class="flex">
  <aside id="sidebar"></aside>

  <main class="flex-1 min-w-0 p-6 lg:p-8 max-w-[1400px]">
    <div class="flex items-center justify-between flex-wrap gap-3">
      <div>
        <h1 id="page-title" class="text-2xl font-bold">ニュース更新</h1>
        <p class="mt-1 text-sm text-[#6B7280]">AIアシスタント「らくらくAI」に指示して、お知らせ原稿を作成します。</p>
      </div>
      <span id="mode-badge" class="hidden text-[12px] font-semibold px-2.5 py-1 rounded-full bg-[#FEF3C7] text-[#92400E]"></span>
    </div>

    <div class="mt-6 grid lg:grid-cols-5 gap-6" style="min-height: 620px;">

      <!-- ===== 左：チャット ===== -->
      <section class="lg:col-span-3 bg-white border border-[#E5E7EB] rounded-xl flex flex-col" style="height: 78vh; min-height: 560px;">
        <div class="px-5 py-3.5 border-b border-[#E5E7EB] flex items-center gap-3">
          <span class="w-9 h-9 rounded-full bg-[#1E2761] flex items-center justify-center text-white">
            <i data-lucide="bot" class="w-5 h-5"></i>
          </span>
          <div>
            <p class="text-sm font-semibold">らくらくAI</p>
            <p class="text-[12px] text-[#6B7280]">お知らせ原稿アシスタント</p>
          </div>
        </div>

        <div id="chat" class="flex-1 overflow-y-auto thin-scroll px-5 py-5 space-y-4"></div>

        <div class="px-4 py-3 border-t border-[#E5E7EB]">
          <div class="flex items-end gap-2">
            <button id="mic-btn" title="音声入力"
              class="w-10 h-10 shrink-0 rounded-lg border border-[#E5E7EB] flex items-center justify-center text-[#6B7280] hover:bg-[#F9FAFB]">
              <i data-lucide="mic" class="w-5 h-5"></i>
            </button>
            <textarea id="chat-input" rows="1" placeholder="例：来週月曜にサーバーメンテナンスがあります。お知らせを作成してください。"
              class="flex-1 resize-none border border-[#E5E7EB] rounded-lg px-3.5 py-2.5 text-sm leading-relaxed focus:border-[#1E2761] outline-none thin-scroll"
              style="max-height: 120px;"></textarea>
            <button id="send-btn"
              class="w-10 h-10 shrink-0 rounded-lg bg-[#1E2761] flex items-center justify-center text-white hover:opacity-90 disabled:opacity-40">
              <i data-lucide="send" class="w-5 h-5"></i>
            </button>
          </div>
          <p class="mt-1.5 text-[11px] text-[#9CA3AF]">Enterで送信／Shift+Enterで改行</p>
        </div>
      </section>

      <!-- ===== 右：プレビュー ===== -->
      <section class="lg:col-span-2 bg-white border border-[#E5E7EB] rounded-xl flex flex-col" style="height: 78vh; min-height: 560px;">
        <div class="flex border-b border-[#E5E7EB]">
          <button data-tab="draft" class="tab-btn flex-1 px-4 py-3 text-sm font-medium border-b-2 border-[#1E2761] text-[#1E2761]">
            生成原稿
          </button>
          <button data-tab="preview" class="tab-btn flex-1 px-4 py-3 text-sm font-medium border-b-2 border-transparent text-[#6B7280]">
            公開プレビュー
          </button>
        </div>

        <!-- 生成原稿（編集） -->
        <div id="tab-draft" class="flex-1 overflow-y-auto thin-scroll p-5">
          <label class="block text-[13px] font-medium text-[#374151] mb-1">タイトル</label>
          <input id="news-title" type="text" placeholder="お知らせのタイトル"
            class="w-full border border-[#E5E7EB] rounded-lg px-3.5 py-2.5 text-sm focus:border-[#1E2761] outline-none" />
          <label class="block text-[13px] font-medium text-[#374151] mb-1 mt-4">本文</label>
          <textarea id="news-body" rows="10" placeholder="AIが生成した本文がここに入ります。直接編集することもできます。"
            class="w-full border border-[#E5E7EB] rounded-lg px-3.5 py-2.5 text-sm leading-relaxed focus:border-[#1E2761] outline-none thin-scroll"></textarea>
          <label class="block text-[13px] font-medium text-[#374151] mb-1 mt-4">サムネイル画像
            <span class="text-[11px] font-normal text-[#9CA3AF]">（AIが内容に応じて自動選択／クリックで変更可）</span>
          </label>
          <div id="image-picker" class="grid grid-cols-3 gap-2"></div>
        </div>

        <!-- 公開プレビュー -->
        <div id="tab-preview" class="hidden flex-1 overflow-y-auto thin-scroll p-5 bg-[#F5F7FA]">
          <p class="text-[12px] text-[#6B7280] mb-3">公開サイトのお知らせカードでの見え方：</p>
          <div class="bg-white border border-[#E5E7EB] rounded-xl overflow-hidden">
            <img id="pv-image" alt="" class="w-full h-44 object-cover bg-[#EEF2FF]" />
            <div class="p-5">
              <span class="inline-block text-xs font-semibold text-white bg-[#0F3D7E] rounded px-2 py-1" id="pv-date"></span>
              <h3 id="pv-title" class="mt-3 text-base font-semibold text-[#1A1A1A] leading-snug">（タイトル未入力）</h3>
              <p id="pv-body" class="mt-2 text-sm text-[#666] article-body"></p>
            </div>
          </div>
        </div>

        <!-- アクション -->
        <div class="px-5 py-3.5 border-t border-[#E5E7EB] flex items-center gap-2">
          <button id="discard-btn"
            class="px-3.5 py-2.5 rounded-lg border border-[#E5E7EB] text-sm font-medium text-[#6B7280] hover:bg-[#F9FAFB]">
            破棄
          </button>
          <button id="save-btn"
            class="flex-1 px-3.5 py-2.5 rounded-lg bg-[#1E2761] text-white text-sm font-semibold hover:opacity-90 disabled:opacity-40">
            下書き保存
          </button>
          <button id="publish-btn"
            class="flex-1 px-3.5 py-2.5 rounded-lg bg-[#10B981] text-white text-sm font-semibold hover:opacity-90 disabled:opacity-40">
            公開する
          </button>
        </div>
      </section>
    </div>
  </main>
</div>

<script src="/assets/store.js"></script>
<script src="/assets/admin.js"></script>
<script>
  const user = initAdmin("news");

  /* ---- 状態 ---- */
  let editId = null;
  let editStatus = null;            // 編集中の記事の現在ステータス
  let conversationHistory = [];     // Claude API 連携用の会話履歴
  let selectedImage = "general";    // 選択中のサムネイル画像
  let busy = false;

  const chat = document.getElementById("chat");
  const input = document.getElementById("chat-input");
  const titleEl = document.getElementById("news-title");
  const bodyEl = document.getElementById("news-body");
  const publishBtn = document.getElementById("publish-btn");

  /* ---- チャット描画 ---- */
  function addUserMsg(text) {
    const el = document.createElement("div");
    el.className = "fade-in flex justify-end";
    el.innerHTML = `<div class="max-w-[80%] bg-[#1E2761] text-white text-sm rounded-2xl rounded-br-sm px-4 py-2.5 leading-relaxed whitespace-pre-wrap">${escapeHtml(text)}</div>`;
    chat.appendChild(el);
    chat.scrollTop = chat.scrollHeight;
  }
  function addAiMsg(html) {
    const el = document.createElement("div");
    el.className = "fade-in flex gap-2.5";
    el.innerHTML = `
      <span class="w-8 h-8 shrink-0 rounded-full bg-[#1E2761] flex items-center justify-center text-white">
        <i data-lucide="bot" class="w-4 h-4"></i>
      </span>
      <div class="max-w-[85%] bg-[#F3F4F6] text-[#111827] text-sm rounded-2xl rounded-bl-sm px-4 py-2.5 leading-relaxed">${html}</div>`;
    chat.appendChild(el);
    lucide.createIcons();
    chat.scrollTop = chat.scrollHeight;
    return el;
  }
  function addTyping() {
    const el = addAiMsg(`<span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span>`);
    el.dataset.typing = "1";
    return el;
  }

  /* ---- プレビュー同期 ---- */
  function syncPreview() {
    document.getElementById("pv-title").textContent = titleEl.value || "（タイトル未入力）";
    document.getElementById("pv-body").textContent = bodyEl.value || "（本文未入力）";
    document.getElementById("pv-image").src = window.newsImageUrl(selectedImage);
    const d = new Date();
    document.getElementById("pv-date").textContent =
      `${d.getFullYear()}.${String(d.getMonth() + 1).padStart(2, "0")}.${String(d.getDate()).padStart(2, "0")}`;
  }
  titleEl.addEventListener("input", syncPreview);
  bodyEl.addEventListener("input", syncPreview);

  /* ---- サムネイル画像ピッカー ---- */
  function renderImagePicker() {
    const host = document.getElementById("image-picker");
    host.innerHTML = window.NEWS_IMAGE_KEYS.map((key) => {
      const on = key === selectedImage;
      return `<button type="button" data-key="${key}"
        class="relative rounded-lg overflow-hidden border-2 ${on ? "border-[#1E2761]" : "border-[#E5E7EB]"}">
        <img src="${window.newsImageUrl(key)}" alt="" class="w-full h-14 object-cover" />
        <span class="block text-[10px] py-0.5 text-center ${on ? "bg-[#1E2761] text-white" : "bg-[#F3F4F6] text-[#6B7280]"}">${window.NEWS_IMAGE_LABELS[key]}</span>
        ${on ? '<span class="absolute top-1 right-1 w-4 h-4 rounded-full bg-[#1E2761] text-white flex items-center justify-center"><i data-lucide="check" class="w-3 h-3"></i></span>' : ""}
      </button>`;
    }).join("");
    if (window.lucide) lucide.createIcons();
  }
  document.getElementById("image-picker").addEventListener("click", (e) => {
    const btn = e.target.closest("[data-key]");
    if (!btn) return;
    selectedImage = btn.dataset.key;
    renderImagePicker();
    syncPreview();
  });

  /* ---- タブ切替 ---- */
  document.querySelectorAll(".tab-btn").forEach((btn) => {
    btn.addEventListener("click", () => {
      const tab = btn.dataset.tab;
      document.querySelectorAll(".tab-btn").forEach((b) => {
        const on = b === btn;
        b.classList.toggle("border-[#1E2761]", on);
        b.classList.toggle("text-[#1E2761]", on);
        b.classList.toggle("border-transparent", !on);
        b.classList.toggle("text-[#6B7280]", !on);
      });
      document.getElementById("tab-draft").classList.toggle("hidden", tab !== "draft");
      document.getElementById("tab-preview").classList.toggle("hidden", tab !== "preview");
      if (tab === "preview") syncPreview();
    });
  });

  /* ---- AI生成 ---- */
  async function generate() {
    if (busy) return;
    const text = input.value.trim();
    if (!text) return;
    busy = true;
    document.getElementById("send-btn").disabled = true;
    input.value = "";
    input.style.height = "auto";
    addUserMsg(text);
    const typing = addTyping();

    try {
      const result = await apiGenerate(text, conversationHistory);
      typing.remove();

      titleEl.value = result.title || "";
      bodyEl.value = result.body || "";
      selectedImage = window.NEWS_IMAGE_KEYS.includes(result.imageKey) ? result.imageKey : "general";
      renderImagePicker();
      syncPreview();

      // 会話履歴を更新（次の修正指示で文脈を引き継ぐ）
      conversationHistory.push({ role: "user", content: text });
      conversationHistory.push({
        role: "assistant",
        content: JSON.stringify({ title: result.title, body: result.body }),
      });

      const meta = result.mode === "live"
        ? `claude-sonnet-4-6 ／ ${result.tokensUsed} トークン`
        : `${result.model}`;
      addAiMsg(`${escapeHtml(result.chatMessage)}
        <span class="block mt-1.5 text-[11px] text-[#9CA3AF]">右側のプレビューに反映しました（${escapeHtml(meta)}）</span>`);

      // ログ記録
      apiLog({
        userName: user.name, action: "generate",
        targetTitle: result.title, aiModel: result.model,
        userPrompt: text, aiOutput: result.body, tokensUsed: result.tokensUsed,
      });
    } catch {
      typing.remove();
      addAiMsg(`<span class="text-[#EF4444]">申し訳ありません、AIアシスタントとの通信に失敗しました。もう一度お試しください。</span>`);
    } finally {
      busy = false;
      document.getElementById("send-btn").disabled = false;
      input.focus();
    }
  }

  document.getElementById("send-btn").addEventListener("click", generate);
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); generate(); }
  });
  input.addEventListener("input", () => {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 120) + "px";
  });

  document.getElementById("mic-btn").addEventListener("click", () => {
    toast("※ デモでは音声入力は無効です", "info");
  });

  /* ---- 保存・公開・破棄 ---- */
  function validate() {
    if (!titleEl.value.trim() || !bodyEl.value.trim()) {
      toast("タイトルと本文を入力してください", "error");
      return false;
    }
    return true;
  }

  document.getElementById("save-btn").addEventListener("click", async () => {
    if (!validate()) return;
    try {
      const data = { title: titleEl.value.trim(), body: bodyEl.value, image: selectedImage, status: "draft", authorName: user.name };
      const saved = editId ? await apiUpdateNews(editId, data) : await apiCreateNews(data);
      await apiLog({ userName: user.name, action: "save_draft", targetId: saved.id, targetTitle: saved.title });
      toast("下書きを保存しました", "success");
      setTimeout(() => (location.href = `/admin/drafts.html?new=${saved.id}`), 600);
    } catch {
      toast("保存に失敗しました", "error");
    }
  });

  publishBtn.addEventListener("click", async () => {
    if (!validate()) return;
    const updating = editStatus === "published";
    const ok = await confirmModal({
      title: updating ? "この記事を更新公開しますか？" : "この記事を公開しますか？",
      message: updating
        ? "編集内容で公開サイトのお知らせを更新します。"
        : "公開サイトのお知らせ欄に、この記事が即時に掲載されます。",
      okText: updating ? "更新公開する" : "公開する",
    });
    if (!ok) return;
    try {
      const data = { title: titleEl.value.trim(), body: bodyEl.value, image: selectedImage, status: "published", authorName: user.name };
      const saved = editId ? await apiUpdateNews(editId, data) : await apiCreateNews(data);
      await apiLog({ userName: user.name, action: "publish", targetId: saved.id, targetTitle: saved.title });
      toast(updating ? "お知らせを更新公開しました" : "お知らせを公開しました", "success");
      setTimeout(() => (location.href = `/admin/published.html?new=${saved.id}`), 600);
    } catch {
      toast("公開に失敗しました", "error");
    }
  });

  document.getElementById("discard-btn").addEventListener("click", async () => {
    const ok = await confirmModal({
      title: "編集内容を破棄しますか？",
      message: "入力中のタイトル・本文・チャット履歴がクリアされます。",
      okText: "破棄する", danger: true,
    });
    if (!ok) return;
    titleEl.value = ""; bodyEl.value = "";
    selectedImage = "general";
    conversationHistory = [];
    chat.innerHTML = "";
    initChat();
    renderImagePicker();
    syncPreview();
    toast("編集内容を破棄しました", "info");
  });

  /* ---- 初期化 ---- */
  function initChat() {
    addAiMsg(`こんにちは、お知らせ作成アシスタント「らくらくAI」です。<br>
      どんなお知らせを掲載しますか？ 内容を教えてください。
      <span class="block mt-2 text-[12px] text-[#6B7280]">例：「来週月曜の9〜12時にサーバーメンテナンスがあります。顧客向けのお知らせを作って」</span>`);
  }

  async function init() {
    const id = new URLSearchParams(location.search).get("id");
    if (id) {
      const n = await apiGetNews(id);
      if (n) {
        editId = n.id;
        editStatus = n.status;
        titleEl.value = n.title;
        bodyEl.value = n.body;
        selectedImage = window.NEWS_IMAGE_KEYS.includes(n.image) ? n.image : "general";
        document.getElementById("page-title").textContent = "ニュース編集";
        const badge = document.getElementById("mode-badge");
        badge.textContent = n.status === "published" ? "公開済み記事を編集中" : "下書きを編集中";
        badge.classList.remove("hidden");
        publishBtn.textContent = n.status === "published" ? "更新公開" : "公開する";
        renderImagePicker();
        syncPreview();
        initChat();
        addAiMsg(`既存の${n.status === "published" ? "公開済み記事" : "下書き"}「${escapeHtml(n.title)}」を読み込みました。<br>
          チャットで修正指示を出すか、右側で直接編集してください。`);
        lucide.createIcons();
        return;
      }
    }
    initChat();
    renderImagePicker();
    syncPreview();
    lucide.createIcons();
  }
  init();
</script>
</body>
</html>
