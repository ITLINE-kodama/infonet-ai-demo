<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ダッシュボード｜AIでらくらく更新</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/assets/styles.css" />
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-[#F9FAFB] text-[#111827]">

<div class="flex">
  <aside id="sidebar"></aside>

  <main class="flex-1 min-w-0 p-8 max-w-[1400px]">
    <div class="flex items-start justify-between flex-wrap gap-4">
      <div>
        <h1 class="text-2xl font-bold">ダッシュボード</h1>
        <p id="welcome" class="mt-1 text-sm text-[#6B7280]">ようこそ</p>
      </div>
      <a href="/admin/news.html"
        class="inline-flex items-center gap-2 px-4 py-2.5 rounded-lg bg-[#1E2761] text-white text-sm font-semibold hover:opacity-90">
        <i data-lucide="plus" class="w-4 h-4"></i> 新規ニュースを作成
      </a>
    </div>

    <!-- 統計カード -->
    <div class="mt-7 grid sm:grid-cols-2 lg:grid-cols-4 gap-4">
      <div class="bg-white border border-[#E5E7EB] rounded-xl p-5">
        <div class="flex items-center justify-between">
          <span class="text-[13px] text-[#6B7280]">公開済み</span>
          <i data-lucide="globe" class="w-4 h-4 text-[#10B981]"></i>
        </div>
        <p class="mt-2 text-3xl font-bold" id="stat-published">–</p>
        <p class="text-[12px] text-[#6B7280] mt-0.5">件のお知らせ</p>
      </div>
      <div class="bg-white border border-[#E5E7EB] rounded-xl p-5">
        <div class="flex items-center justify-between">
          <span class="text-[13px] text-[#6B7280]">下書き</span>
          <i data-lucide="file-text" class="w-4 h-4 text-[#F59E0B]"></i>
        </div>
        <p class="mt-2 text-3xl font-bold" id="stat-drafts">–</p>
        <p class="text-[12px] text-[#6B7280] mt-0.5">件の下書き</p>
      </div>
      <div class="bg-white border border-[#E5E7EB] rounded-xl p-5">
        <div class="flex items-center justify-between">
          <span class="text-[13px] text-[#6B7280]">今月のAI生成</span>
          <i data-lucide="sparkles" class="w-4 h-4 text-[#00B8D9]"></i>
        </div>
        <p class="mt-2 text-3xl font-bold" id="stat-generated">–</p>
        <p class="text-[12px] text-[#6B7280] mt-0.5">回</p>
      </div>
      <div class="bg-white border border-[#E5E7EB] rounded-xl p-5">
        <div class="flex items-center justify-between">
          <span class="text-[13px] text-[#6B7280]">AIモデル</span>
          <i data-lucide="cpu" class="w-4 h-4 text-[#1E2761]"></i>
        </div>
        <p class="mt-2 text-lg font-bold leading-tight">Claude<br />Sonnet 4.5</p>
      </div>
    </div>

    <div class="mt-7 grid lg:grid-cols-3 gap-6">
      <!-- 最近の活動 -->
      <div class="lg:col-span-2 bg-white border border-[#E5E7EB] rounded-xl p-6">
        <div class="flex items-center justify-between">
          <h2 class="text-base font-semibold">最近の活動</h2>
          <a href="/admin/logs.html" class="text-[13px] font-medium text-[#1E2761] hover:underline">すべて見る →</a>
        </div>
        <ul id="recent" class="mt-4 divide-y divide-[#E5E7EB]">
          <li class="py-6 text-center text-sm text-[#6B7280]">読み込み中…</li>
        </ul>
      </div>

      <!-- クイックガイド + リセット -->
      <div class="space-y-6">
        <div class="bg-[#EEF2FF] border border-[#E5E7EB] rounded-xl p-6">
          <div class="flex items-center gap-2 text-[#1E2761]">
            <i data-lucide="info" class="w-5 h-5"></i>
            <h2 class="text-base font-semibold">このデモについて</h2>
          </div>
          <p class="mt-3 text-[13px] text-[#374151] leading-relaxed">
            「ニュース更新」画面でAIに指示すると、お知らせ原稿が自動生成されます。
            内容を確認・編集し、「公開」すると公開サイトに即反映されます。
            すべての操作は「ログ・履歴」に記録されます。
          </p>
        </div>
        <div class="bg-white border border-[#E5E7EB] rounded-xl p-6">
          <h2 class="text-base font-semibold">デモ環境の管理</h2>
          <p class="mt-2 text-[13px] text-[#6B7280] leading-relaxed">
            デモで作成したお知らせ・ログを初期状態に戻します。
          </p>
          <button id="reset-btn"
            class="mt-3 w-full py-2 rounded-lg border border-[#E5E7EB] text-sm font-medium text-[#374151] hover:bg-[#F9FAFB]">
            デモデータをリセット
          </button>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="/assets/store.js"></script>
<script src="/assets/admin.js"></script>
<script>
  const user = initAdmin("dashboard");

  const ACTION_LABEL = {
    generate: "AIでお知らせを生成", save_draft: "下書きを保存",
    publish: "お知らせを公開", unpublish: "お知らせを非公開化",
    delete: "お知らせを削除", edit: "お知らせを編集", login: "ログイン",
  };
  const ACTION_ICON = {
    generate: "sparkles", save_draft: "file-text", publish: "globe",
    unpublish: "eye-off", delete: "trash-2", edit: "pencil", login: "log-in",
  };

  async function loadDashboard() {
    document.getElementById("welcome").textContent =
      `ようこそ、${user.name} さん`;
    try {
      const [news, logs] = await Promise.all([apiListNews(), apiListLogs()]);
      const published = news.filter((n) => n.status === "published").length;
      const drafts = news.filter((n) => n.status === "draft").length;
      const thisMonth = new Date().toISOString().slice(0, 7);
      const generated = logs.filter(
        (l) => l.action === "generate" && (l.timestamp || "").startsWith(thisMonth)
      ).length;

      document.getElementById("stat-published").textContent = published;
      document.getElementById("stat-drafts").textContent = drafts;
      document.getElementById("stat-generated").textContent = generated;

      const recent = document.getElementById("recent");
      const items = logs.slice(0, 5);
      if (items.length === 0) {
        recent.innerHTML =
          `<li class="py-6 text-center text-sm text-[#6B7280]">まだ活動はありません。</li>`;
      } else {
        recent.innerHTML = items
          .map(
            (l) => `
          <li class="py-3 flex items-center gap-3">
            <span class="w-8 h-8 rounded-lg bg-[#EEF2FF] flex items-center justify-center text-[#1E2761] shrink-0">
              <i data-lucide="${ACTION_ICON[l.action] || "circle"}" class="w-4 h-4"></i>
            </span>
            <div class="min-w-0 flex-1">
              <p class="text-sm font-medium truncate">${escapeHtml(ACTION_LABEL[l.action] || l.action)}
                ${l.targetTitle ? `<span class="text-[#6B7280] font-normal">— ${escapeHtml(l.targetTitle)}</span>` : ""}
              </p>
              <p class="text-[12px] text-[#6B7280]">${escapeHtml(l.userName)} ・ ${formatDateTime(l.timestamp)}</p>
            </div>
          </li>`
          )
          .join("");
      }
      lucide.createIcons();
    } catch {
      document.getElementById("recent").innerHTML =
        `<li class="py-6 text-center text-sm text-[#EF4444]">データの読み込みに失敗しました。</li>`;
    }
  }

  document.getElementById("reset-btn").addEventListener("click", async () => {
    const ok = await confirmModal({
      title: "デモデータをリセットしますか？",
      message: "作成したお知らせとログをすべて削除し、初期状態（お知らせ3件）に戻します。",
      okText: "リセットする",
      danger: true,
    });
    if (!ok) return;
    await apiResetDemo();
    toast("デモデータを初期状態に戻しました", "success");
    loadDashboard();
  });

  loadDashboard();
</script>
</body>
</html>
