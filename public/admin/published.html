<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>公開済み一覧｜AIでらくらく更新</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/assets/styles.css" />
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-[#F9FAFB] text-[#111827]">

<div class="flex">
  <aside id="sidebar"></aside>

  <main class="flex-1 min-w-0 p-8 max-w-[1400px]">
    <div class="flex items-center justify-between flex-wrap gap-3">
      <div class="flex items-center gap-2">
        <h1 class="text-2xl font-bold">公開済み</h1>
        <span id="count" class="text-sm font-semibold text-[#065F46] bg-[#D1FAE5] rounded-full px-2.5 py-0.5">0</span>
      </div>
      <a href="/" target="_blank"
        class="inline-flex items-center gap-2 px-4 py-2.5 rounded-lg border border-[#E5E7EB] bg-white text-sm font-semibold text-[#374151] hover:bg-[#F9FAFB]">
        <i data-lucide="external-link" class="w-4 h-4"></i> 公開サイトを開く
      </a>
    </div>

    <div class="mt-6 bg-white border border-[#E5E7EB] rounded-xl">
      <div class="overflow-x-auto thin-scroll rounded-xl">
      <table class="w-full text-sm min-w-[880px]">
        <thead>
          <tr class="bg-[#F9FAFB] text-left text-[12px] text-[#6B7280] border-b border-[#E5E7EB]">
            <th class="px-5 py-3 font-medium">タイトル</th>
            <th class="px-5 py-3 font-medium w-44">公開日時</th>
            <th class="px-5 py-3 font-medium w-40">公開者</th>
            <th class="px-5 py-3 font-medium w-56 text-right">操作</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
      </div>
      <div id="empty" class="hidden px-5 py-16 text-center">
        <i data-lucide="globe" class="w-10 h-10 mx-auto text-[#D1D5DB]"></i>
        <p class="mt-3 text-sm text-[#6B7280]">公開済みのお知らせはありません。</p>
      </div>
    </div>
  </main>
</div>

<script src="/assets/store.js"></script>
<script src="/assets/admin.js"></script>
<script>
  const user = initAdmin("published");
  const newId = new URLSearchParams(location.search).get("new");

  async function load() {
    let list = [];
    try { list = await apiListNews("published"); } catch {}
    document.getElementById("count").textContent = list.length;
    const rows = document.getElementById("rows");
    const empty = document.getElementById("empty");

    if (list.length === 0) {
      rows.innerHTML = "";
      empty.classList.remove("hidden");
      lucide.createIcons();
      return;
    }
    empty.classList.add("hidden");
    rows.innerHTML = list
      .map(
        (n) => `
      <tr data-id="${n.id}" class="border-b border-[#E5E7EB] last:border-0 hover:bg-[#F9FAFB] ${n.id === newId ? "row-flash" : ""}">
        <td class="px-5 py-3.5">
          <div class="flex items-center gap-3">
            <img src="${window.newsImageUrl(n.image)}" alt="" class="w-14 h-10 rounded object-cover shrink-0 border border-[#E5E7EB]" />
            <div class="min-w-0">
              <a href="/news.html?id=${n.id}" target="_blank" class="font-medium text-[#111827] hover:text-[#1E2761]">${escapeHtml(n.title)}</a>
              <span class="ml-1.5 inline-block text-[11px] font-semibold text-[#065F46] bg-[#D1FAE5] rounded px-1.5 py-0.5 align-middle">公開中</span>
              <p class="text-[12px] text-[#6B7280] mt-0.5">${escapeHtml(excerpt(n.body, 48))}</p>
            </div>
          </div>
        </td>
        <td class="px-5 py-3.5 text-[#6B7280]">${formatDateTime(n.publishedAt || n.updatedAt)}</td>
        <td class="px-5 py-3.5 text-[#6B7280]">${escapeHtml(n.authorName)}</td>
        <td class="px-5 py-3.5">
          <div class="flex justify-end gap-1.5">
            <a href="/news.html?id=${n.id}" target="_blank" class="px-2.5 py-1.5 rounded-md border border-[#E5E7EB] text-[12px] font-medium text-[#374151] hover:bg-white">表示</a>
            <a href="/admin/news.html?id=${n.id}" class="px-2.5 py-1.5 rounded-md border border-[#E5E7EB] text-[12px] font-medium text-[#374151] hover:bg-white">編集</a>
            <button data-act="unpublish" class="px-2.5 py-1.5 rounded-md border border-[#FCD34D] text-[12px] font-medium text-[#92400E] hover:bg-[#FFFBEB]">非公開化</button>
          </div>
        </td>
      </tr>`
      )
      .join("");
    lucide.createIcons();
  }

  document.getElementById("rows").addEventListener("click", async (e) => {
    const btn = e.target.closest("[data-act]");
    if (!btn) return;
    const tr = btn.closest("tr");
    const id = tr.dataset.id;
    const title = tr.querySelector("a").textContent;

    if (btn.dataset.act === "unpublish") {
      const ok = await confirmModal({
        title: "この記事を非公開にしますか？",
        message: `「${title}」を下書きに戻します。公開サイトのお知らせ欄からも削除されます。`,
        okText: "非公開にする", danger: true,
      });
      if (!ok) return;
      try {
        await apiUpdateNews(id, { status: "draft" });
        await apiLog({ userName: user.name, action: "unpublish", targetId: id, targetTitle: title });
        toast("お知らせを非公開化しました", "info");
        setTimeout(() => (location.href = "/admin/drafts.html"), 700);
      } catch { toast("処理に失敗しました", "error"); }
    }
  });

  load();
</script>
</body>
</html>
