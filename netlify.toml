[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# /api/* へのリクエストを Netlify Functions に転送
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# サイトマップを動的生成（ニュース・求人・ブログを含む）
[[redirects]]
  from = "/sitemap.xml"
  to = "/api/sitemap"
  status = 200
  force = true

# きれいな記事URL（/news/seed-001 など）でも詳細ページを表示
[[redirects]]
  from = "/news/*"
  to = "/news.html"
  status = 200
